{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="mb-3">Inicia sesión</h3>

    {% if form.non_field_errors %}
      <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
    {% endif %}

    <form method="post" action="" novalidate>
      {% csrf_token %}
      <div class="mb-2">{{ form.username }}</div>
      <div class="mb-3">{{ form.password }}</div>
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button class="btn btn-dark w-100" type="submit">Entrar</button>
    </form>

    <div class="mt-3">
      <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>
{% endblock %}
