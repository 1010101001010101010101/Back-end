{% extends "base.html" %}
{% block title %}Dispositivos{% endblock %}
{% block content %}
<h3>Dispositivos de tu organización</h3>
{% if devices %}
  <ul class="list-group">
    {% for d in devices %}
      <li class="list-group-item">{{ d.name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p class="text-muted">No hay dispositivos.</p>
{% endif %}
{% endblock %}
